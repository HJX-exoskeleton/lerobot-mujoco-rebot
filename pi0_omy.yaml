dataset:
  repo_id: omy_pnp_language # Repository ID
  root: ./demo_data_language # Your root for data file!
policy:
  type : pi0
  chunk_size: 5
  n_action_steps: 5
  # Reduces trainable parameters, but Pi0 can still exceed 8 GB VRAM.
  freeze_vision_encoder: true
  train_expert_only: true
  
save_checkpoint: true
output_dir: ./ckpt/pi0_omy # Save directory
batch_size: 1
job_name : pi0_omy
resume: false 
seed : 42
num_workers: 0
steps: 20_000
eval_freq: -1 # No evaluation
log_freq: 50
save_checkpoint: true
save_freq: 10_000
use_policy_training_preset: true
  
wandb:
  enable: false
  project: pi0_omy
  entity: null
  disable_artifact: true
